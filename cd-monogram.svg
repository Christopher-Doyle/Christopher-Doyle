 <path d="M254 157 H216 C169 157 137 194 137 250 C137 306 169 343 216 343 H254" stroke-width="25">
   <animate attributeName="stroke-dasharray" values="0 500;440 0" dur=".95s" fill="freeze"/>
 </path>
 <path d="M242 157 H291 C345 157 382 194 382 250 C382 306 345 343 291 343 H242 V157 Z" stroke-width="23">
   <animate attributeName="stroke-dasharray" values="0 650;590 0" begin=".18s" dur="1.05s" fill="freeze"/>
 </path>
</g>
  <g stroke="#61f7ff" fill="none" stroke-width="7" opacity="0">
    <path d="M254 157 H216 C169 157 137 194 137 250 C137 306 169 343 216 343 H254"/>
    <path d="M242 157 H291 C345 157 382 194 382 250 C382 306 345 343 291 343 H242 V157 Z"/>
    <animate attributeName="opacity" values="0;0;.55;0;0;.38;0" keyTimes="0;.49;.505;.535;.79;.805;1" dur="4.8s" repeatCount="indefinite" calcMode="discrete"/>
    <animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-4 0" dur=".16s" repeatCount="indefinite"/>
  </g>
  <g stroke="#d178ff" fill="none" stroke-width="5" opacity="0">
    <path d="M254 157 H216 C169 157 137 194 137 250 C137 306 169 343 216 343 H254"/>
    <path d="M242 157 H291 C345 157 382 194 382 250 C382 306 345 343 291 343 H242 V157 Z"/>
    <animate attributeName="opacity" values="0;0;.38;0;0;.5;0" keyTimes="0;.495;.51;.54;.795;.81;1" dur="4.8s" repeatCount="indefinite" calcMode="discrete"/>
    <animateTransform attributeName="transform" type="translate" values="5 0;-5 0;3 0" dur=".14s" repeatCount="indefinite"/>
  </g>
</g>

