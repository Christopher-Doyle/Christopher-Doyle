<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030507"/><stop offset=".55" stop-color="#06100d"/><stop offset="1" stop-color="#090611"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6affd4"/><stop offset=".48" stop-color="#68d9ff"/><stop offset="1" stop-color="#ca7dff"/></linearGradient>
 <linearGradient id="hot" x1="0" x2="1"><stop stop-color="#6affd4"/><stop offset=".62" stop-color="#68d9ff"/><stop offset="1" stop-color="#d79aff"/></linearGradient>
 <radialGradient id="core"><stop offset="0%" stop-color="#64ffd2" stop-opacity=".14"/><stop offset="100%" stop-color="#05070a" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="520" height="520" rx="18" fill="url(#bg)"/><rect x="2" y="2" width="516" height="516" rx="16" fill="none" stroke="#173c33"/>
