<svg xmlns="http://www.w3.org/2000/svg" width="620" height="310" viewBox="0 0 620 310">
<defs>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#ffd36a"/><stop offset="1" stop-color="#ff8f6b"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#ffd36a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd36a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd36a" stop-opacity="0"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#ffd36a" stop-opacity=".12"/><stop offset="1" stop-color="#05070a" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="620" height="310" rx="18" fill="#05070a"/>
<rect x="2" y="2" width="616" height="306" rx="16" fill="none" stroke="url(#edge)" stroke-opacity=".55"/>
<rect x="14" y="14" width="592" height="282" rx="12" fill="none" stroke="#17322d" stroke-dasharray="2 7"/>

<!-- scan -->
<rect x="15" y="18" width="590" height="2" fill="url(#beam)" opacity=".6">
 <animate attributeName="y" values="18;288;18" dur="5.5s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values=".1;.65;.1" dur="5.5s" repeatCount="indefinite"/>
</rect>

<!-- corner brackets -->
<g fill="none" stroke="#ffd36a" stroke-width="2" opacity=".75">
 <path d="M24 54V28H50"/><path d="M570 28H596V54"/><path d="M24 256V282H50"/><path d="M570 282H596V256"/>
</g>

<!-- left node -->
<circle cx="83" cy="108" r="49" fill="url(#core)" stroke="#ffd36a" stroke-opacity=".36"/>
<circle cx="83" cy="108" r="36" fill="none" stroke="#ffd36a" stroke-dasharray="3 8" opacity=".55">
 <animateTransform attributeName="transform" type="rotate" from="0 83 108" to="360 83 108" dur="11s" repeatCount="indefinite"/>
</circle>
<circle cx="83" cy="108" r="22" fill="#07100e" stroke="#ff8f6b" stroke-opacity=".75"/>
<text x="83" y="114" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#ffd36a" filter="url(#glow)">PU</text>

<!-- header -->
<text x="151" y="59" font-family="monospace" font-size="11" fill="#617a73">PROJECT NODE // TELEMETRY</text>
<text x="151" y="91" font-family="monospace" font-size="29" font-weight="700" fill="#ffd36a" filter="url(#glow)">PULSE</text>
<text x="151" y="117" font-family="monospace" font-size="11.5" fill="#d6e8e3">REAL-TIME SYSTEM OBSERVABILITY</text>

<!-- status strip -->
<rect x="151" y="137" width="420" height="27" rx="7" fill="#07110f" stroke="#17372f"/>
<circle cx="167" cy="150.5" r="4" fill="#ffd36a">
 <animate attributeName="opacity" values="1;.18;1" dur="1.1s" repeatCount="indefinite"/>
</circle>
<text x="180" y="154" font-family="monospace" font-size="10.5" fill="#8ca49d">TELEMETRY NODE ACTIVE</text>
<text x="506" y="154" font-family="monospace" font-size="10.5" fill="#ff8f6b">PLANNED</text>

<!-- body -->
<text x="36" y="197" font-family="monospace" font-size="13" fill="#d7e5e1">Host metrics, live streaming,</text>
<text x="36" y="218" font-family="monospace" font-size="13" fill="#d7e5e1">history and threshold alerts.</text>
<text x="36" y="248" font-family="monospace" font-size="10.5" fill="#718881">GO  WEBSOCKETS  REACT  TIME-SERIES</text>

<!-- circuitry -->
<g stroke="#ff8f6b" stroke-width="1" opacity=".25" fill="none">
 <path d="M446 207H493V189H548"/><path d="M470 232H530V250H575"/>
 <circle cx="548" cy="189" r="3" fill="#ff8f6b"/><circle cx="575" cy="250" r="3" fill="#ff8f6b"/>
</g>

<!-- open -->
<rect x="36" y="267" width="150" height="24" rx="6" fill="#07110f" stroke="#ffd36a" stroke-opacity=".45"/>
<text x="49" y="283" font-family="monospace" font-size="10.5" fill="#ffd36a">[ OPEN REPOSITORY ]</text>
<path d="M188 279H219" stroke="#ff8f6b" stroke-width="1.5">
 <animate attributeName="x2" values="219;231;219" dur="1.6s" repeatCount="indefinite"/>
</path>

<!-- intermittent glitch slices -->
<g opacity="0">
 <rect x="145" y="76" width="275" height="5" fill="#ffd36a" opacity=".35"/>
 <rect x="205" y="102" width="310" height="3" fill="#ff8f6b" opacity=".28"/>
 <animate attributeName="opacity" values="0;0;.8;0;0;.6;0" keyTimes="0;.47;.49;.515;.78;.80;1" dur="5.2s" repeatCount="indefinite" calcMode="discrete"/>
 <animateTransform attributeName="transform" type="translate" values="-8 0;9 0;-5 0" dur=".14s" repeatCount="indefinite"/>
</g>
</svg>